  <meta name="theme-color" content="#000000" id="theme-color-meta" />
  <script>
    (function () {
      try {
        var path = window.location.pathname || '';
        var scope = 'default';
        if (path.indexOf('/seller') === 0) scope = 'seller';
        else if (path.indexOf('/creator') === 0) scope = 'creator';
        else if (path.indexOf('/buyer') === 0) scope = 'buyer';
        else if (path.indexOf('/shop') === 0) scope = 'shop';

        var key = 'byblos-theme-' + scope;
        var pref = localStorage.getItem(key);
        if (!pref && scope === 'creator') pref = localStorage.getItem('byblos-theme-ambassador');
        if (!pref) pref = localStorage.getItem('byblos-app-theme') || localStorage.getItem('byblos-theme-default') || 'system';

        var isDark = true;
        if (pref === 'light') {
          isDark = false;
        } else if (pref === 'dark') {
          isDark = true;
        } else if (window.matchMedia) {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        var resolved = isDark ? 'dark' : 'light';
        var doc = document.documentElement;
        doc.setAttribute('data-theme', resolved);
        if (isDark) {
          doc.classList.add('dark');
          doc.classList.remove('light');
        } else {
          doc.classList.add('light');
          doc.classList.remove('dark');
        }
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', isDark ? '#000000' : '#f5f4f0');
      } catch (e) {}
    })();
  </script>

    html[data-theme="light"],

    html.light,

    html[data-theme="dark"],
