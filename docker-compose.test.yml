# Ephemeral Postgres + Redis for local integration & E2E tests.
# Data lives in tmpfs, so every `up` starts from a clean slate and `down -v`
# leaves nothing behind. Ports match server/.env.test.example (Postgres 3001,
# Redis 6380) so they never collide with a real local DB on 5432/6379.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   (cd server && npm run db:migrate:test && npm run test:integration)
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres-test:
    image: postgres:17-alpine
    container_name: byblos-postgres-test
    environment:
      POSTGRES_DB: byblos_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:3001:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d byblos_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    container_name: byblos-redis-test
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
