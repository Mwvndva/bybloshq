services:
  - type: web
    name: byblos-atelier-api
    runtime: node
    # Migrations run in buildCommand, NOT just preDeployCommand: Render's
    # pre-deploy command is only supported on paid web services ("The
    # pre-deploy command is available for paid web services, private
    # services, and background workers" -- render.com/docs/deploys). This
    # service is on the free plan (see `plan: free` below), so
    # preDeployCommand below was silently never executing -- new code kept
    # shipping against whatever schema production already had, which is
    # exactly what caused the terms_accepted production incident (code
    # deployed expecting a column a migration never applied). Running
    # `npm run migrate` here, inside the build step that every plan
    # supports, is what actually guarantees migrations run before the new
    # version serves traffic. node-pg-migrate is idempotent per migration
    # (tracked in the `pgmigrations` table), so it's safe to also leave
    # preDeployCommand in place below: it's a harmless no-op today and
    # becomes a second, redundant safety net for free if this service is
    # ever upgraded to a paid plan.
    buildCommand: npm run build && npm run migrate
    preDeployCommand: npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # API-only role: cron jobs, outbox replay, and withdrawal retry run in the
      # dedicated worker service below — NOT here. This prevents the web dyno (and
      # any horizontally-scaled replicas) from double-executing scheduled jobs.
      - key: BYBLOS_PROCESS_ROLE
        value: api
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: byblos
          property: hostname
      - key: DB_PORT
        fromDatabase:
          name: byblos
          property: port
      - key: DB_NAME
        fromDatabase:
          name: byblos
          property: database
      - key: DB_USER
        fromDatabase:
          name: byblos
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: byblos
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
    # Free plan suspends after 15 min of inactivity. Upgrade to `standard` (or
    # higher) for production traffic — change requires billing approval.
    plan: free

  - type: worker
    name: byblos-atelier-worker
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      # The single process that owns all scheduled/background jobs. Keep this
      # service at exactly one instance so non-advisory-locked crons run once.
      - key: BYBLOS_PROCESS_ROLE
        value: worker
      - key: DB_HOST
        fromDatabase:
          name: byblos
          property: hostname
      - key: DB_PORT
        fromDatabase:
          name: byblos
          property: port
      - key: DB_NAME
        fromDatabase:
          name: byblos
          property: database
      - key: DB_USER
        fromDatabase:
          name: byblos
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: byblos
          property: password
      - key: JWT_SECRET
        fromDatabase:
          name: byblos-atelier-api
          property: JWT_SECRET
      - key: JWT_EXPIRES_IN
        value: 24h
    plan: free

